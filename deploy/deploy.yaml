# Akash deployment for trial-scout.
# Profile and notification topic are injected as env vars at deploy time:
# replace the two marked values before `akash tx deployment create`.
#
# Privacy note: env vars are visible to the provider. The profile contains
# age, city, and DBS status for one person. Use a provider you are
# comfortable with, or leave the profile off and run scans locally.
---
version: "2.0"

services:
  trial-scout:
    image: ghcr.io/toxmon/trial-scout:sha-7b9dc2896e6b8a01e22784fd444bb1e95dad12e5
    expose:
      - port: 8080
        as: 80
        proto: tcp
        to:
          - global: true
    env:
      - TRIAL_PROFILE_JSON={"age":70,"dbs":"considering","stage":"moderate","levodopa_years":4,"home_city":"jackson_ms","travel":"full_day","willing_observational":"yes"}
      - TRIAL_SCOUT_NTFY_TOPIC=trialscout-c62667
      - TRIAL_SCOUT_INTERVAL_MINUTES=1440
      - OPENAI_BASE_URL=https://api.venice.ai/api/v1
      - OPENAI_MODEL=zai-org-glm-4.7-flash
      - OPENAI_API_KEY_B64=VkVOSUNFX0lORkVSRU5DRV9LRVlfcVlyaVg3RVotUktocGtycTZpbDA2Q0NmNlRtVjJHZ05EZDZsVURxVEhm
      - TRIAL_SCOUT_PROFILE_PATH=/app/data/trial_profile.json
      - TRIAL_SCOUT_DIGEST_PATH=/app/data/research_digest.md

profiles:
  compute:
    trial-scout:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          - size: 512Mi
  placement:
    global:
      pricing:
        trial-scout:
          denom: uact
          amount: 5000

deployment:
  trial-scout:
    global:
      profile: trial-scout
      count: 1
