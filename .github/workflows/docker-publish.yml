name: Build and publish container image

on:
  push:
    branches: [main]
    paths:
      - "src/trial_scout/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/toxmon/parkinsons-discovery:latest
            ghcr.io/toxmon/parkinsons-discovery:sha-${{ github.sha }}
