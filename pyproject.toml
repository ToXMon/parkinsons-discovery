[project]
name = "parkinsons-discovery"
version = "0.1.0"
description = "Hypothesis registry for computational Parkinson's therapy research. Not a treatment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pd-registry = "parkinsons_discovery.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkinsons_discovery"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
